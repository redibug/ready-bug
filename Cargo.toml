[package]
name = "ready-bug"
version = "0.2.0"
edition = "2024"
description = "Ready Bug — an agent-first local AI command center (ratatui TUI, Ollama, ComfyUI)"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "6"
